const CAP={appartement:6,chalet:12};
const $=s=>document.querySelector(s);
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const iso=d=>d.toISOString().slice(0,10);
const add=(s,n)=>iso(new Date(D(s).getTime()+n*864e5));

const today=iso(new Date(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())));
const LANGS=['fr','en','nl','de','it','zh'];const navLang=()=>{const n=(navigator.language||'fr').slice(0,2).toLowerCase();return LANGS.includes(n)?n:'en';};let lang='fr'; try{const s=localStorage.getItem('dahu-lang');lang=LANGS.includes(s)?s:navLang();}catch(e){lang=navLang();}
let home='chalet', arr=null, dep=null, view=null, adults=2, kids=0, copiedFlag=false;

function priceOf(lg,d){for(const p of DATA.tarifs[lg])if(p.du<=d&&d<p.au)return p.bloque?null:p.prix;return null;}
function taken(lg,d){return DATA.occupe[lg].some(o=>o.du<=d&&d<o.au);}
function nightFree(lg,d){return d>=today&&priceOf(lg,d)!=null&&!taken(lg,d);}
function canArrive(lg,d){return nightFree(lg,d);}
function canDepart(lg,d){return arr&&d>arr;} // range validity checked separately
function rangeOk(lg,a,b){for(let d=a;d<b;d=add(d,1))if(!nightFree(lg,d))return false;return true;}
function quoteGross(lg,a,b){let t=0;for(let d=a;d<b;d=add(d,1))t+=priceOf(lg,d)||0;return t;}
const PROMO_H='6a28fbc801da6d0aef051e81001ee138d25135ea0aa9631c14ab9e1b20c9fdf3';let promo=false,promoErr=false;
async function checkPromo(code){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code.trim().toLowerCase()));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===PROMO_H;}catch(_){return false;}}
function quote(lg,a,b){const g=quoteGross(lg,a,b);if(promo)return Math.round(g*0.7);return nightsBetween(a,b)>=14?Math.round(g*0.85):g;}
function minFrom(lg){let m=Infinity;for(const p of DATA.tarifs[lg])if(!p.bloque&&p.au>today)m=Math.min(m,p.prix);return m===Infinity?null:m;}
function money(n){return n.toLocaleString(T[lang].loc,{style:'currency',currency:'EUR',maximumFractionDigits:0});}
function long(s){return D(s).toLocaleDateString(T[lang].loc,{weekday:'short',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});}
function firstMonth(lg){for(const p of DATA.tarifs[lg]){if(p.bloque||p.au<=today)continue;let d=p.du>today?p.du:today;for(;d<p.au;d=add(d,1))if(!taken(lg,d))return d.slice(0,7);}return today.slice(0,7);}
function lastMonth(){let m='';for(const lg in DATA.tarifs)for(const p of DATA.tarifs[lg])if(add(p.au,-1).slice(0,7)>m)m=add(p.au,-1).slice(0,7);return m;}
function shiftMonth(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+String(m).padStart(2,'0');}

function applyLang(){document.documentElement.lang=lang;const t=T[lang];
  document.querySelectorAll('[data-t]').forEach(el=>{const v=t[el.dataset.t];if(typeof v==='string'){if(el.dataset.t==='h1')el.innerHTML=v;else el.textContent=v;}});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));}

function renderHomes(){const t=T[lang];
  $('#homes').innerHTML=['appartement','chalet'].map(k=>{const h=k==='chalet'?t.chalet:t.appt,m=minFrom(k);
    return `<button type="button" class="home" data-home="${k}" aria-pressed="${home===k}">
      <span class="kind">${h.kind}</span><h2>${h.name}</h2>

      <span class="from"><span>${m?t.from+' <strong>'+money(m)+'</strong> '+t.night:''}</span><span class="pick">${home===k?t.chosen:t.choose}</span></span></button>`;}).join('');
  $('#who').textContent=(home==='chalet'?t.chalet.name:t.appt.name);}

function renderCal(){const t=T[lang],months=[view,shiftMonth(view,1)];
  $('#prev').disabled=view<=today.slice(0,7);$('#next').disabled=shiftMonth(view,1)>=lastMonth();
  $('#months').innerHTML=months.map(ym=>{const[y,m]=ym.split('-').map(Number);const first=new Date(Date.UTC(y,m-1,1));const lead=(first.getUTCDay()+6)%7;const n=new Date(Date.UTC(y,m,0)).getUTCDate();
    let cells='';for(let i=0;i<lead;i++)cells+='<span class="d blank"></span>';
    for(let i=1;i<=n;i++){const d=ym+'-'+String(i).padStart(2,'0');const free=nightFree(home,d),p=priceOf(home,d),prevFree=d>today&&nightFree(home,add(d,-1));
      const inSel=arr&&dep&&d>=arr&&d<dep, isArr=d===arr, isDep=d===dep;
      const depCandidate=arr&&!dep&&d>arr&&rangeOk(home,arr,d);

      let cls='d'+(((first.getUTCDay()+i-1)%7)===6?' sat':'')+(clickable?'':' off')+(inSel||isArr||isDep?'':half)+(inSel?(isArr?' edge':' in'):'')+(isArr&&!dep?' edge':'')+(isDep?' dep':'');
      cells+=`<button type="button" class="${cls}" data-d="${d}" ${clickable?'':'disabled'} aria-label="${long(d)}${free&&p?', '+money(p):''}"><span class="n">${i}</span><span class="p">${free&&p?p:''}</span></button>`;}
    return `<div class="m"><h3>${lang==='zh'?y+'年'+m+'月':t.months[m-1]+' '+y}</h3><div class="dow">${t.dows.map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div></div>`;}).join('');}

function recapText(){const t=T[lang],h=home==='chalet'?t.chalet:t.appt,n=nightsBetween(arr,dep);

function formUrl(){const f=DATA.formulaire;if(!f||!f.url)return null;const c=f.champs||{},p=new URLSearchParams({usp:'pp_url'});
  const h=home==='chalet'?'Chalet – Le Dahu du Hameau':'Appartement – Le Petit Dahu';
  const set=(k,v)=>{if(c[k])p.set(c[k],v)};set('logement',h);set('arrivee',arr);set('depart',dep);set('nuits',String(nightsBetween(arr,dep)));
  set('prix',String(quote(home,arr,dep)));set('adultes',String(adults));set('enfants',String(kids));set('langue',lang==='fr'?'FR':'EN');{const ms=[];if(lang!=='fr'&&lang!=='en')ms.push('Langue du site : '+lang.toUpperCase());if(promo)ms.push('Code promo famille et amis appliqué (−30 %)');if(ms.length)set('message',ms.join(' · '));}
  return f.url+(f.url.includes('?')?'&':'?')+p.toString();}

function renderSum(){const t=T[lang],el=$('#sum');
  if(!arr){el.innerHTML=`<h3>${t.total}</h3><p class="msg">${t.sumEmpty}</p><p class="msg">${t.taxe}</p>`;return;}
  if(!dep){el.innerHTML=`<h3>${t.total}</h3><div class="row"><span>${t.arr}</span><span>${long(arr)}</span></div><p class="msg">${t.sumDep}</p><p class="msg">${t.minN}</p><button type="button" class="ghost" id="reset">${t.reset}</button>`;return;}
  const n=nightsBetween(arr,dep),ok=rangeOk(home,arr,dep),tot=quote(home,arr,dep),capOk=adults+kids<=CAP[home],minOk=n>=7;
  const valid=ok&&capOk&&minOk;const url=valid?formUrl():null;
  let warn='';if(!ok)warn=t.unavail;else if(!minOk)warn=t.minN;else if(!capOk)warn=t.cap+CAP[home]+t.pers;
  el.innerHTML=`<h3>${home==='chalet'?t.chalet.name:t.appt.name}</h3>
   <div class="row"><span>${t.arr}</span><span>${long(arr)}</span></div>
   <div class="row"><span>${t.dep}</span><span>${long(dep)}</span></div>
   <div class="row"><span>${t.nights}</span><span>${n}</span></div>
   ${ok&&(promo||n>=14)?`<div class="row"><span>${promo?t.promoOk:t.disc}</span><span>−${money(quoteGross(home,arr,dep)-tot)}</span></div>`:''}
   ${promo&&n>=14?`<p class="msg">${t.promoNote}</p>`:''}
   ${ok?`<div class="row"><span>${t.avg}</span><span>${money(Math.round(tot/n))}</span></div>`:''}
   <div class="ppl"><label>${t.adults}<input type="number" id="adults" min="1" max="${CAP[home]}" value="${adults}"></label><label>${t.children}<input type="number" id="kids" min="0" max="${CAP[home]}" value="${kids}"></label></div>
   ${ok?`<div class="total"><span class="msg">${t.total}</span><strong>${money(tot)}</strong></div>`:''}
   ${promo?'':`<div class="promo"><label>${t.promo}<span class="pr-row"><input id="promoIn" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="ghost" id="promoBtn">${t.promoBtn}</button></span></label>${promoErr?`<span class="msg warn">${t.promoBad}</span>`:''}</div>`}
   ${warn?`<p class="msg warn">${warn}</p>`:''}
   ${valid?(url?`<a class="cta" href="${url}" target="_blank" rel="noopener">${t.send}</a>`:`<p class="msg">${t.soon}</p><pre class="recap" id="recap">${recapText()}</pre><button type="button" class="ghost" id="copy">${copiedFlag?t.copied:t.copy}</button>`):`<span class="cta" aria-disabled="true">${t.send}</span>`}
   <p class="msg">${t.taxe}</p><button type="button" class="ghost" id="reset">${t.reset}</button>`;}

function renderContact(){const c=DATA.contact;if(!c)return;$('#contactBox').hidden=false;$('#cMail').textContent=c.email||'';$('#cTel').textContent=c.tel||'';if(c.facebook){const a=$('#cFb');a.href=c.facebook;a.hidden=false;}}
function photos(){return (DATA.photos&&DATA.photos[home])||[];}
let lbIdx=0;
function renderGal(){const ph=photos(),g=$('#gal');if(!ph.length){g.hidden=true;g.innerHTML='';return;}g.hidden=false;
  const cap=x=>(x[lang]||x.en), n=ph.length;
  const b=(i,cls,inner)=>`<button type="button" class="${cls}" data-ph="${i}" aria-label="${cap(ph[i])}"><img src="${i===0?ph[i].f:ph[i].t}" alt="${cap(ph[i])}" ${i===0?'':'loading="lazy"'}>${inner||''}</button>`;
  g.innerHTML=b(0,'hero-ph',`<span class="cap">${cap(ph[0])}</span>`)+(n>1?`<div class="side">${n>1?b(1,'',''):''}${n>2?b(2,'',`<span class="more">${T[lang].seeAll.replace('{n}',n)}</span>`):''}</div>`:'');}
function openLb(i){lbIdx=i;showLb();$('#lb').hidden=false;document.body.style.overflow='hidden';$('#lbClose').focus();}
function showLb(){const ph=photos();if(!ph.length)return;lbIdx=(lbIdx+ph.length)%ph.length;const x=ph[lbIdx];
  $('#lbImg').src=x.f;$('#lbImg').alt=(x[lang]||x.en);$('#lbCap').textContent=((x[lang]||x.en))+'  ·  '+(lbIdx+1)+' / '+ph.length;}
function closeLb(){$('#lb').hidden=true;document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if($('#lb').hidden)return;if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft'){lbIdx--;showLb();}if(e.key==='ArrowRight'){lbIdx++;showLb();}});
(function(){let x0=null;const lb=document.getElementById('lb');lb.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){lbIdx+=dx<0?1:-1;showLb();}x0=null;});})();
function renderGuides(){const g=DATA.guides&&DATA.guides[home],el=$('#guides');if(!g){el.hidden=true;return;}el.hidden=false;
  el.innerHTML=`<span>${T[lang].guide}</span><a href="${g.fr}" target="_blank" rel="noopener">Français</a><a href="${g.en}" target="_blank" rel="noopener">English</a>`;}
function render(){applyLang();renderContact();renderGal();renderGuides();renderHomes();renderCal();renderSum();}

document.addEventListener('click',e=>{
  const ph=e.target.closest('[data-ph]');if(ph){openLb(+ph.dataset.ph);return;}
  if(e.target.id==='lbClose'||e.target.id==='lb'){closeLb();return;}
  if(e.target.id==='lbPrev'){lbIdx--;showLb();return;}
  if(e.target.id==='lbNext'){lbIdx++;showLb();return;}
  const l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;try{localStorage.setItem('dahu-lang',lang)}catch(_){}render();return;}
  const h=e.target.closest('[data-home]');if(h){if(home!==h.dataset.home){home=h.dataset.home;arr=dep=null;view=firstMonth(home);if(adults+kids>CAP[home])adults=Math.min(adults,CAP[home]),kids=0;}render();return;}
  const d=e.target.closest('.d[data-d]');if(d&&!d.disabled){const v=d.dataset.d;copiedFlag=false;
    if(!arr||dep||v<=arr){if(nightFree(home,v)){arr=v;dep=null;}}else if(rangeOk(home,arr,v)){dep=v;}else if(nightFree(home,v)){arr=v;dep=null;}
    renderCal();renderSum();return;}
  if(e.target.id==='prev'){view=shiftMonth(view,-1);renderCal();return;}
  if(e.target.id==='next'){view=shiftMonth(view,1);renderCal();return;}
  if(e.target.id==='promoBtn'){applyPromo();return;}
  if(e.target.id==='reset'){arr=dep=null;renderCal();renderSum();return;}
  if(e.target.id==='copy'){const txt=recapText();const done=()=>{copiedFlag=true;renderSum();};
    try{navigator.clipboard.writeText(txt).then(done,()=>{selectRecap();});}catch(_){selectRecap();}}
});
async function applyPromo(){const v=($('#promoIn')||{}).value||'';promo=await checkPromo(v);promoErr=!promo&&v.trim()!=='';renderSum();}
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='promoIn'&&e.key==='Enter'){e.preventDefault();applyPromo();}});
function selectRecap(){const r=$('#recap');if(!r)return;const s=window.getSelection(),rg=document.createRange();rg.selectNodeContents(r);s.removeAllRanges();s.addRange(rg);}
document.addEventListener('input',e=>{if(e.target.id==='adults'||e.target.id==='kids'){adults=Math.max(1,+$('#adults').value||1);kids=Math.max(0,+$('#kids').value||0);
  const pos=e.target.id;renderSum();const el=$('#'+pos);if(el){el.focus();try{el.setSelectionRange(99,99)}catch(_){}}}});
view=firstMonth(home);render();
})();
</script>
</body></html>
